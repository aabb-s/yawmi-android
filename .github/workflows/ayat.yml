name: Fetch verses
on:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/ayat.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_ayat.py
      - run: python3 tools/fetch_hadith.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update verse data from published sources"
          git push
