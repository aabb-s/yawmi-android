name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASS secrets in Settings > Secrets and variables > Actions"; exit 1; fi
          mkdir -p signing && echo "$KEYSTORE_B64" | base64 -d > signing/yawmi.p12
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk yawmi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yawmi-apk
          path: yawmi.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest yawmi.apk --title "يومي ${{ github.run_number }}" --notes "آخر نسخة من تطبيق يومي. نزّل yawmi.apk وافتحه على التلفون."
